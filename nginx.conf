server {
    listen 80;
    server_name costtracker.md-95.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name costtracker.md-95.com;

    ssl_certificate /etc/letsencrypt/live/costtracker.md-95.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/costtracker.md-95.com/privkey.pem;

    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}