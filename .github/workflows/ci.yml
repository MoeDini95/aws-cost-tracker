name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]


jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Pylint Code Quality
        run: |
          pip install pylint
          pylint app/

      - name: Run Tests
        run: pytest tests/ -v


      - name: Log into Github Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Trivy base scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: python:3.12-slim
          format: 'table'
          exit-code: '0'
          severity: 'CRITICAL,HIGH'
          trivyignores: .trivyignore

      - name: Build and push docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/moedini95/aws-cost-tracker:latest

      - name: Run Trivy final scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/moedini95/aws-cost-tracker:latest
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          trivyignores: .trivyignore